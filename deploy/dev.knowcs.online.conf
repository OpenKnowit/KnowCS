server {
    listen 80;
    server_name dev.knowcs.online;
    location ^~ /.well-known/acme-challenge/ {
        root /www/sites/knowcs-dev/acme;
    }
    location / { return 301 https://dev.knowcs.online$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dev.knowcs.online;
    root /www/sites/knowcs-dev/current;
    index index.html;
    ssl_certificate /www/sites/knowcs-dev/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/knowcs-dev/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    error_page 404 /404.html;
    # the dev branch: reachable, but kept out of search results
    add_header X-Robots-Tag "noindex, nofollow" always;
    # content-hashed file names: a changed file always gets a new name, so cache for a year
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # the admin API (knowcs-admin.service, server/admin.mjs): the Resources list and its editor
    location /api/ {
        proxy_pass http://127.0.0.1:3021;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # pages, sw.js, offline.json, manifest: always revalidate so a new release shows up at once
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
