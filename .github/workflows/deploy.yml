name: Validate KnowCS

on:
  push:
    branches: [main]
    # 纯文档/配置改动不触发校验（一次 push 全部命中这些路径时跳过）。
    # 想强制校验可在 Actions 页用 workflow_dispatch 手动触发。
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

# 同一时间只跑一个校验，新 push 会取消旧任务
concurrency:
  group: knowcs-ci
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
